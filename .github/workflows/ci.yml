name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit tests without a database
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build -PskipIntegrationTests
      - name: Verify Docker image build
        run: docker build --tag mallang:ci .
      - name: Clean up test resources
        if: always()
        run: |
          if docker image inspect mallang:ci >/dev/null 2>&1; then
            docker image rm mallang:ci
          fi
          rm -rf -- build
