name: mallang

services:
  # 외부 MySQL(RDS)에 연결하는 Spring Boot 애플리케이션입니다.
  app:
    image: "${DOCKERHUB_USERNAME}/mallang:latest"
    build: .
    container_name: mallang-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    environment:
      # DB 접속 정보는 .env에서 주입합니다.
      LOCAL_DB_URL: ${LOCAL_DB_URL}
      LOCAL_DB_USERNAME: ${LOCAL_DB_USERNAME}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD}

      # 애플리케이션 실행 설정입니다.
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul

    # 로컬 Docker에서 호스트 PC의 MySQL에 접속할 때 사용합니다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
